<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Word Cloud</title>
<style>
  :root {
    --bg: #0b0e1a; --card: #141830; --line: #252b4d; --text: #e9ecff; --muted: #8e96c4;
    --accent: #6ea8ff; --accent2: #b07cff; --pos: #35d49a; --neg: #ff6b81;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #1b2250 0%, transparent 60%),
                radial-gradient(900px 500px at 100% 0%, #2b1a50 0%, transparent 55%), var(--bg);
  }
  main { max-width: 980px; margin: 0 auto; padding: 56px 16px 64px; }
  h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 8px; letter-spacing: -0.02em; text-align: center; }
  h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 32px; }
  form { display: flex; gap: 10px; background: var(--card); border: 1px solid var(--line); padding: 8px; border-radius: 16px; box-shadow: 0 10px 40px #0006; }
  input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 18px; padding: 12px 14px; }
  input::placeholder { color: #5d6595; }
  button { border: 0; cursor: pointer; font-size: 16px; font-weight: 600; color: #0b0e1a; padding: 0 26px; border-radius: 11px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: transform .12s, opacity .12s; }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .6; cursor: wait; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 500; font-size: 14px; padding: 6px 14px; border-radius: 999px; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  #status { text-align: center; margin: 28px 0 0; color: var(--muted); min-height: 24px; }
  #status.error { color: var(--neg); }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #result { display: none; margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 10px 40px #0006; animation: pop .45s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(12px); } to { opacity: 1; transform: none; } }
  .head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .head h2 { margin: 0; font-size: 22px; text-transform: capitalize; }
  .head small { color: var(--muted); }
  #cloud { width: 100%; border-radius: 12px; display: block; }
  .bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin: 18px 0 8px; background: var(--line); }
  .bar i { display: block; transition: width .8s ease; }
  .bar .p { background: var(--pos); } .bar .n { background: var(--neg); }
  .legend { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .legend b.p { color: var(--pos); } .legend b.n { color: var(--neg); }
  .words { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
  .words span { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #1d2347; color: #c9d1ff; }
  @media (max-width: 520px) { form { flex-direction: column; } button { padding: 12px; } }
</style>
</head>
<body>
<main>
  <h1>Movie <span>Word Cloud</span></h1>
  <p class="sub">Enter a movie name and see what reviewers talk about.</p>

  <form id="form">
    <input id="movie" type="text" placeholder="e.g. Titanic" autocomplete="off" autofocus required>
    <button id="go" type="submit">Generate</button>
  </form>
  <div class="chips" id="chips">
    <button class="chip" type="button">Titanic</button>
    <button class="chip" type="button">Batman</button>
    <button class="chip" type="button">Star Wars</button>
    <button class="chip" type="button">Matrix</button>
  </div>

  <p id="status"></p>

  <section id="result">
    <div class="head"><h2 id="title"></h2><small id="count"></small></div>
    <img id="cloud" alt="Word cloud">
    <div class="bar"><i class="p" id="barP"></i><i class="n" id="barN"></i></div>
    <div class="legend"><span><b class="p" id="pos"></b> positive</span><span><b class="n" id="neg"></b> negative</span></div>
    <div class="words" id="words"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const status = $("status");

async function generate(name) {
  $("go").disabled = true;
  $("result").style.display = "none";
  status.className = "";
  status.innerHTML = '<span class="spinner"></span>Building word cloud…';
  try {
    const res = await fetch("/api/wordcloud", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ movie: name })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");

    $("title").textContent = data.movie;
    $("count").textContent = data.review_count.toLocaleString() + " reviews analysed";
    $("cloud").src = data.image;
    const total = data.positive + data.negative || 1;
    $("barP").style.width = (100 * data.positive / total) + "%";
    $("barN").style.width = (100 * data.negative / total) + "%";
    $("pos").textContent = data.positive.toLocaleString() + " (" + data.positive_pct + "%)";
    $("neg").textContent = data.negative.toLocaleString();
    $("words").replaceChildren(...data.top_words.map(w => {
      const s = document.createElement("span"); s.textContent = w; return s;
    }));
    status.textContent = "";
    $("result").style.display = "block";
    $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (err) {
    status.className = "error";
    status.textContent = err.message;
  } finally {
    $("go").disabled = false;
  }
}

$("form").addEventListener("submit", e => { e.preventDefault(); generate($("movie").value.trim()); });
$("chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) { $("movie").value = e.target.textContent; generate(e.target.textContent); }
});
</script>
</body>
</html>
